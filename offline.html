<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090B" />
  <title>Modo Offline — Ação Digital</title>
  <link rel="icon" type="image/png" href="./icons/favicon-32.png" />
  <style>
    :root {
      --bg: #09090B;
      --surface: #121216;
      --border: rgba(255, 255, 255, 0.1);
      --gold: #E5B822;
      --gold-hover: #F5C83B;
      --text: #FAFAFA;
      --muted: #A1A1AA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      display: block;
      object-fit: contain;
    }
    .badge {
      display: inline-block;
      background: rgba(229, 184, 34, 0.14);
      color: var(--gold);
      border: 1px solid rgba(229, 184, 34, 0.35);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 { font-size: 1.35rem; margin-bottom: 0.75rem; line-height: 1.3; }
    p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--gold); color: #09090B; }
    .btn-primary:hover { background: var(--gold-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="./assets/simbolo-acao.png" alt="Símbolo Ação Contabilidade" class="logo" />
    <span class="badge">Conexão indisponível</span>
    <h1>Você está offline</h1>
    <p>
      Você está offline. Algumas ferramentas continuam disponíveis, mas funcionalidades que dependem de internet estão temporariamente indisponíveis.
    </p>
    <div class="actions">
      <a href="./index.html" class="btn btn-primary">Abrir Ferramentas Offline</a>
      <button type="button" class="btn btn-secondary" onclick="window.location.reload()">Tentar reconectar</button>
    </div>
  </main>
</body>
</html>
